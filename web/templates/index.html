<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Interleave</title>
    <style>
        :root {
            --bg-a: #f4f0e6;
            --bg-b: #dce8ee;
            --ink: #1f2d3a;
            --accent: #b24c2f;
            --accent-2: #2b6f8c;
            --panel: #fffdfa;
            --line: #d7cfbf;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: var(--ink);
            font-family: "Trebuchet MS", "Gill Sans", sans-serif;
            background:
                radial-gradient(circle at 15% 20%, #f9e4c8 0%, transparent 32%),
                radial-gradient(circle at 85% 5%, #cde0ea 0%, transparent 35%),
                linear-gradient(135deg, var(--bg-a), var(--bg-b));
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .panel {
            width: min(960px, 100%);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 18px 36px rgba(31, 45, 58, 0.12);
            overflow: hidden;
            animation: fade-in 260ms ease-out;
        }
        .head {
            padding: 20px 24px 14px;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(180deg, #fff8ee, #fffdfa);
        }
        h1 {
            margin: 0;
            font-family: "Palatino Linotype", "Book Antiqua", serif;
            font-size: 1.8rem;
            letter-spacing: 0.02em;
        }
        .meta {
            margin-top: 8px;
            color: #4e5c67;
            font-size: 0.95rem;
        }
        .tabs {
            display: flex;
            gap: 8px;
            padding: 16px 24px 0;
        }
        .tab {
            border: 1px solid #c8bec0;
            border-radius: 10px;
            background: #fff;
            color: #31414d;
            font-size: 0.94rem;
            font-weight: 700;
            padding: 10px 14px;
            cursor: pointer;
            box-shadow: none;
        }
        .tab[aria-selected="true"] {
            border-color: transparent;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
        }
        form {
            padding: 20px 24px 24px;
            display: grid;
            gap: 16px;
        }
        form[hidden] { display: none; }
        .grid {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }
        label {
            display: grid;
            gap: 6px;
            font-size: 0.93rem;
            color: #31414d;
        }
        input, select {
            border: 1px solid #c8bec0;
            border-radius: 10px;
            padding: 10px 11px;
            font-size: 0.95rem;
            background: #fff;
            color: var(--ink);
        }
        .row {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
        }
        .checkbox {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.93rem;
        }
        .checkbox input { width: 16px; height: 16px; }
        .primary {
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            font-size: 0.98rem;
            font-weight: 600;
            padding: 12px 18px;
            cursor: pointer;
            transition: transform 140ms ease, box-shadow 140ms ease;
            box-shadow: 0 10px 20px rgba(43, 111, 140, 0.28);
        }
        .primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 24px rgba(43, 111, 140, 0.34);
        }
        .order-list {
            display: grid;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .order-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            padding: 8px;
        }
        .file-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.94rem;
        }
        .move {
            width: 36px;
            height: 34px;
            border: 1px solid #c8bec0;
            border-radius: 9px;
            background: #f9f7f2;
            color: #31414d;
            cursor: pointer;
            font-weight: 700;
        }
        .move:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .error {
            border: 1px solid #d88d88;
            background: #fdecea;
            color: #6f2420;
            border-radius: 10px;
            padding: 10px 12px;
            margin: 16px 24px 0;
            font-size: 0.94rem;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<main class="panel" data-initial-mode="{{ values.mode }}">
    <section class="head">
        <h1>PDF Interleave</h1>
        <div class="meta">RAM-only output, link TTL {{ ttl_seconds }}s, max {{ max_file_mb }} MB per file, up to {{ max_upload_files }} files.</div>
    </section>
    <nav class="tabs" aria-label="PDF operation">
        <button class="tab" type="button" data-mode="interleave" aria-selected="true">Interleave 2 PDFs</button>
        <button class="tab" type="button" data-mode="concat" aria-selected="false">Merge N PDFs</button>
    </nav>
    {% if error_message %}
    <div class="error">{{ error_message }}</div>
    {% endif %}
    <form action="/merge" method="post" enctype="multipart/form-data" data-form="interleave">
        <div class="grid">
            <label>
                PDF A
                <input type="file" name="file_a" accept="application/pdf,.pdf" required>
            </label>
            <label>
                PDF B
                <input type="file" name="file_b" accept="application/pdf,.pdf" required>
            </label>
        </div>
        <div class="grid">
            <label>
                Order A
                <select name="order_a">
                    <option value="asc" {% if values.order_a == 'asc' %}selected{% endif %}>asc</option>
                    <option value="desc" {% if values.order_a == 'desc' %}selected{% endif %}>desc</option>
                    <option value="range" {% if values.order_a == 'range' %}selected{% endif %}>range</option>
                    <option value="list" {% if values.order_a == 'list' %}selected{% endif %}>list</option>
                    <option value="slice" {% if values.order_a == 'slice' %}selected{% endif %}>slice</option>
                </select>
            </label>
            <label>
                Pages A (optional for asc/desc)
                <input name="pages_a" value="{{ values.pages_a }}">
            </label>
            <label>
                Order B
                <select name="order_b">
                    <option value="asc" {% if values.order_b == 'asc' %}selected{% endif %}>asc</option>
                    <option value="desc" {% if values.order_b == 'desc' %}selected{% endif %}>desc</option>
                    <option value="range" {% if values.order_b == 'range' %}selected{% endif %}>range</option>
                    <option value="list" {% if values.order_b == 'list' %}selected{% endif %}>list</option>
                    <option value="slice" {% if values.order_b == 'slice' %}selected{% endif %}>slice</option>
                </select>
            </label>
            <label>
                Pages B (optional for asc/desc)
                <input name="pages_b" value="{{ values.pages_b }}">
            </label>
        </div>
        <div class="grid">
            <label>
                Start
                <select name="start">
                    <option value="A" {% if values.start == 'A' %}selected{% endif %}>A</option>
                    <option value="B" {% if values.start == 'B' %}selected{% endif %}>B</option>
                </select>
            </label>
            <label>
                Policy
                <select name="policy">
                    <option value="append" {% if values.policy == 'append' %}selected{% endif %}>append</option>
                    <option value="truncate" {% if values.policy == 'truncate' %}selected{% endif %}>truncate</option>
                    <option value="error" {% if values.policy == 'error' %}selected{% endif %}>error</option>
                </select>
            </label>
        </div>
        <div class="row">
            <label class="checkbox">
                <input type="checkbox" name="strict" {% if values.strict %}checked{% endif %}>
                Strict mode (reject duplicate pages)
            </label>
            <button class="primary" type="submit">Merge PDFs</button>
        </div>
    </form>
    <form action="/concat" method="post" enctype="multipart/form-data" data-form="concat" hidden>
        <label>
            PDFs
            <input id="concat-files" type="file" name="files" accept="application/pdf,.pdf" multiple required>
        </label>
        <input id="concat-order" type="hidden" name="order">
        <ol id="concat-list" class="order-list"></ol>
        <div class="row">
            <span class="meta">Output follows the order shown above.</span>
            <button class="primary" type="submit">Merge PDFs</button>
        </div>
    </form>
</main>
<script>
    const panel = document.querySelector(".panel");
    const tabs = [...document.querySelectorAll(".tab")];
    const forms = [...document.querySelectorAll("[data-form]")];
    const initialMode = panel.dataset.initialMode === "concat" ? "concat" : "interleave";

    function setMode(mode) {
        tabs.forEach((tab) => tab.setAttribute("aria-selected", String(tab.dataset.mode === mode)));
        forms.forEach((form) => {
            form.hidden = form.dataset.form !== mode;
        });
    }

    tabs.forEach((tab) => tab.addEventListener("click", () => setMode(tab.dataset.mode)));
    setMode(initialMode);

    const fileInput = document.getElementById("concat-files");
    const orderInput = document.getElementById("concat-order");
    const list = document.getElementById("concat-list");
    let order = [];

    function renderOrder() {
        const files = [...fileInput.files];
        orderInput.value = order.join(",");
        list.innerHTML = "";

        order.forEach((fileIndex, position) => {
            const item = document.createElement("li");
            item.className = "order-item";

            const name = document.createElement("span");
            name.className = "file-name";
            name.textContent = `${position + 1}. ${files[fileIndex].name}`;

            const up = document.createElement("button");
            up.type = "button";
            up.className = "move";
            up.textContent = "Up";
            up.disabled = position === 0;
            up.addEventListener("click", () => move(position, -1));

            const down = document.createElement("button");
            down.type = "button";
            down.className = "move";
            down.textContent = "Dn";
            down.disabled = position === order.length - 1;
            down.addEventListener("click", () => move(position, 1));

            item.append(name, up, down);
            list.append(item);
        });
    }

    function move(position, direction) {
        const next = position + direction;
        [order[position], order[next]] = [order[next], order[position]];
        renderOrder();
    }

    fileInput.addEventListener("change", () => {
        order = [...fileInput.files].map((_, index) => index);
        renderOrder();
    });
</script>
</body>
</html>
